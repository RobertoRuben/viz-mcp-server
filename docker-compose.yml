version: '3.9'

services:
  viz-mcp-server:
    build: .
    image: viz-mcp-server:latest
    container_name: viz-mcp-server
    restart: unless-stopped
    ports:
      - "${MCP_APP_PORT:-3031}:${MCP_APP_PORT:-3031}"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_APP_NAME=${MCP_APP_NAME:-Viz Engine}
      - MCP_APP_PORT=${MCP_APP_PORT:-3031}
      - MCP_ENV=${MCP_ENV:-development}
      - CHART_DPI=${CHART_DPI:-300}
      - CHART_STYLE=${CHART_STYLE:-whitegrid}
      - DATA_DIR=${DATA_DIR:-/app/data} 
      - SHARED_VOLUME_PATH=${DATA_DIR:-/app/data}
      
    volumes:
      - ${HOST_SHARED_PATH:-/root/mcp-shared-data}:${DATA_DIR:-/app/data}