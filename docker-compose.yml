version: '3.8'

services:
  viz-mcp-server:
    build: .
    image: viz-mcp-server:latest
    container_name: viz-mcp-server
    restart: unless-stopped
    ports:
      - "3031:3031"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3031/sse"]
      interval: 30s
      timeout: 10s
      retries: 3